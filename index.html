<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall Volunteers | Daily Plan</title><style>:root{--navy:#10243e;--red:#b51f2e;--bg:#f6f7f9;--line:#e1e5ea;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#182230}.wrap{max-width:900px;margin:auto;padding:0 18px}.top{background:var(--navy);color:#fff;padding:26px 0}.top h1{margin:0 0 6px;font-size:30px}.top p{margin:0;color:#dbe4ee}.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0}.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px;font-weight:700;cursor:pointer}.filters button.active{background:var(--navy);color:#fff}.summary{padding:22px 0 8px}.summary strong{color:var(--red)}.month{margin:20px 0 35px}.month h2{font-size:23px;border-bottom:2px solid var(--navy);padding-bottom:7px}.day{background:#fff;border:1px solid var(--line);border-radius:10px;margin:9px 0;padding:14px}.dayhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.dayhead h3{font-size:16px;margin:0}.goal{font-size:12px;color:var(--muted);font-weight:700}.tasks{margin:10px 0 0;padding-left:20px}.tasks li{margin:5px 0;font-size:14px}.note{font-size:12px;color:var(--muted);margin-top:8px}.footer{padding:25px 0;color:var(--muted);font-size:12px}@media(max-width:520px){.top h1{font-size:25px}.dayhead{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="wrap"><h1>Daily Volunteer Plan</h1><p>August 27 – December 31, 2026 · Goal: 100–150 active volunteers</p></div></header><div class="bar"><div class="wrap filters"><button class="active" data-m="all">All</button><button data-m="7">Aug</button><button data-m="8">Sep</button><button data-m="9">Oct</button><button data-m="10">Nov</button><button data-m="11">Dec</button></div></div><main class="wrap"><div class="summary">Start: <strong>15 volunteers</strong> → Sept 30: <strong>35</strong> → Oct 31: <strong>60</strong> → Nov 30: <strong>85</strong> → Dec 31: <strong>100–150</strong>.</div><div id="root"></div><div class="footer">Keep recruitment broad and public. Follow current Elections BC requirements for recall canvassing, fundraising and paid advertising.</div></main><script>const S=new Date(2026,7,27),E=new Date(2026,11,31),months=['Jan','Feb','Mar','Apr','May','Jun','Jul','August','September','October','November','December'],days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const plan={0:['Post a short weekly recap and next-week preview.','Thank this week’s volunteers and ask for their next availability.','Update active count, new signups and inactive list.'],1:['Post a short progress update.','Contact every new signup not yet reached.','Clean the volunteer list and assign next actions.'],2:['Post a short video showing one volunteer role.','Follow up with people who showed interest but have not started.','Prepare materials and check the next public activity.'],3:['Post a photo, FAQ or behind-the-scenes update.','Confirm newcomers for orientation or their first activity.','Build the upcoming volunteer roster.'],4:['Post a short volunteer/campaign activity video.','Run weekly volunteer orientation.','Give every newcomer a coordinator and a next activity.'],5:['Post the confirmed weekend activity information.','Send final details to volunteers attending.','Check supplies, permissions, meeting point and backup plan.'],6:['Post photos/video from lawful campaign activity.','Run the scheduled public activity where permitted.','Log attendance, inquiries and new volunteer signups.']};function goal(d){let a=[[new Date(2026,7,27),15],[new Date(2026,8,30),35],[new Date(2026,9,31),60],[new Date(2026,10,30),85],[new Date(2026,11,31),110]];for(let i=0;i<a.length-1;i++)if(d>=a[i][0]&&d<=a[i+1][0]){let p=(d-a[i][0])/(a[i+1][0]-a[i][0]);return Math.round(a[i][1]+p*(a[i+1][1]-a[i][1]))}return 110}function special(d){let m=d.getMonth(),n=d.getDate();if(m===7)return 'Setup week: verify signup form, coordinators and current volunteer status.';if(m===8&&n<=7)return 'Priority: build a reliable weekly recruitment and onboarding routine.';if(m===8&&n>21)return 'Priority: close the gap to 35 active volunteers.';if(m===9&&n<=10)return 'Priority: add team leads as the roster grows.';if(m===9&&n>20)return 'Priority: finish October near 60 active volunteers.';if(m===10)return n>20?'Priority: finish November near 85 active volunteers.':'Priority: retention and reactivating inactive volunteers.';if(m===11&&n>27)return 'Priority: verify the year-end active roster and finish the 100–150 goal push.';if(m===11&&n>=21)return 'Holiday week: lighter field work; focus on follow-up and roster cleanup.';return ''}function render(f='all'){let root=document.getElementById('root');root.innerHTML='';let g={};for(let d=new Date(S);d<=E;d.setDate(d.getDate()+1)){let x=new Date(d);if(f!=='all'&&x.getMonth()!=f)continue;(g[x.getMonth()]??=[]).push(x)}Object.entries(g).forEach(([m,ds])=>{let sec=document.createElement('section');sec.className='month';sec.innerHTML='<h2>'+months[m]+' 2026</h2>';ds.forEach(d=>{let t=plan[d.getDay()],sp=special(d);let el=document.createElement('article');el.className='day';el.innerHTML='<div class="dayhead"><h3>'+days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate()+'</h3><span class="goal">Pace: ~'+goal(d)+' active</span></div><ul class="tasks"><li>'+t[0]+'</li><li>'+t[1]+'</li><li>'+t[2]+'</li></ul>'+(sp?'<div class="note">'+sp+'</div>':'');sec.appendChild(el)});root.appendChild(sec)})}render();document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.m==='all'?'all':Number(b.dataset.m))});</script></body></html>
